{% extends "scheduler/layout.html" %}

{% block body %}
    <h1>Time Tables</h1>
    <ul>
        {% for section in sections %}
            <li>
                <a href="{% url 'section_detail' section.id %}">{{ section }}</a>                
            </li>
        {% empty %}
            <li>No section available.</li>
        {% endfor %}
    </ul>
{% endblock %}
